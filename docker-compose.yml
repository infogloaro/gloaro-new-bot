services:
  postgres:
    image: postgres:16-alpine
    container_name: gloaro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gloaro
      POSTGRES_PASSWORD: gloaro_dev_password
      POSTGRES_DB: gloaro_bot
    ports:
      - "5433:5432"
    volumes:
      - gloaro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gloaro -d gloaro_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gloaro-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - gloaro_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gloaro_pgdata:
  gloaro_redisdata:
