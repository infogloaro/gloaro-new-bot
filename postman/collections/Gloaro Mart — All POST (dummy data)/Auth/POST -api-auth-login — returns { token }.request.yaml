$kind: http-request
name: POST /api/auth/login — returns { token }
description: |-
  Auth: no login

  returns { token }
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "customer@example.com",
      "password": "Password123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: const j = pm.response.json(); if (j.token) pm.collectionVariables.set('token', j.token);
    language: text/javascript
order: 3000
