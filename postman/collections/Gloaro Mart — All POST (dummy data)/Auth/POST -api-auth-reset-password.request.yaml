$kind: http-request
name: POST /api/auth/reset-password
url: "{{baseUrl}}/api/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "<code from email>",
      "password": "NewPassword123"
    }
auth:
  type: noauth
order: 7000
