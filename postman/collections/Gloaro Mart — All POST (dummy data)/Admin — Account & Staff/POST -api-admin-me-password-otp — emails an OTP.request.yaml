$kind: http-request
name: POST /api/admin/me/password/otp — emails an OTP
description: |-
  Auth: admin

  emails an OTP
url: "{{baseUrl}}/api/admin/me/password/otp"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "AdminPass123",
      "newPassword": "NewAdminPass123"
    }
order: 1000
