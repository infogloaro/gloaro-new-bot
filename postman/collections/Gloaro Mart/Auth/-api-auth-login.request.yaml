$kind: http-request
name: /api/auth/login
url: "{{baseUrl}}/api/auth/login"
method: POST
body:
  type: json
  content: |-
    {
        "email": "<email>",
        "password": "<password>"
    }
scripts:
  - type: afterResponse
    code: pm.environment.set('token', pm.response.json().token);
    language: text/javascript
order: 2000
